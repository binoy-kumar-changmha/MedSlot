<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif">
  <rect width="1200" height="780" fill="#F8FAFC"/>
  <text x="40" y="42" font-size="22" font-weight="700" fill="#0F172A">MedSlot — Low-Fidelity UI Prototype &amp; Wireframe Mockups</text>
  <text x="40" y="66" font-size="13" fill="#475569">Four core views: Staff Auth, Dashboard Overview, Appointment Booking, and Billing &amp; Payment</text>

  <!-- Panel 1: Login -->
  <g transform="translate(40,90)">
    <rect width="540" height="310" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <rect width="540" height="36" rx="12" fill="#F1F5F9"/>
    <rect y="24" width="540" height="12" fill="#F1F5F9"/>
    <circle cx="20" cy="18" r="5" fill="#94A3B8"/><circle cx="36" cy="18" r="5" fill="#94A3B8"/><circle cx="52" cy="18" r="5" fill="#94A3B8"/>
    <text x="75" y="22" font-size="12" font-weight="600" fill="#334155">1. Staff Sign-In View (/login)</text>

    <rect x="145" y="62" width="250" height="220" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-dasharray="4 3"/>
    <rect x="242" y="78" width="56" height="22" rx="6" fill="#0F766E"/>
    <text x="270" y="93" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">MedSlot</text>
    <text x="270" y="116" text-anchor="middle" font-size="13" font-weight="600" fill="#0F172A">Clinic Portal Sign In</text>
    <rect x="170" y="130" width="200" height="28" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="180" y="148" font-size="11" fill="#64748B">Email (admin@medslot.local)</text>
    <rect x="170" y="166" width="200" height="28" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="180" y="184" font-size="11" fill="#64748B">Password (••••••••)</text>
    <rect x="170" y="204" width="200" height="30" rx="6" fill="#0F766E"/>
    <text x="270" y="223" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">Sign In</text>
    <rect x="170" y="242" width="200" height="24" rx="6" fill="#FFFFFF" stroke="#0F766E"/>
    <text x="270" y="258" text-anchor="middle" font-size="10" font-weight="600" fill="#0F766E">Use Demo Account</text>
  </g>

  <!-- Panel 2: Dashboard -->
  <g transform="translate(620,90)">
    <rect width="540" height="310" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <rect width="540" height="36" rx="12" fill="#F1F5F9"/>
    <rect y="24" width="540" height="12" fill="#F1F5F9"/>
    <circle cx="20" cy="18" r="5" fill="#94A3B8"/><circle cx="36" cy="18" r="5" fill="#94A3B8"/><circle cx="52" cy="18" r="5" fill="#94A3B8"/>
    <text x="75" y="22" font-size="12" font-weight="600" fill="#334155">2. Clinic Overview Dashboard (/)</text>

    <!-- Sidebar wireframe -->
    <rect x="12" y="48" width="110" height="248" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="24" y="70" font-size="11" font-weight="700" fill="#0F766E">MedSlot</text>
    <rect x="20" y="84" width="94" height="22" rx="4" fill="#CCFBF1"/>
    <text x="28" y="99" font-size="10" font-weight="600" fill="#0F766E">Dashboard</text>
    <text x="28" y="125" font-size="10" fill="#475569">Patients</text>
    <text x="28" y="147" font-size="10" fill="#475569">Doctors</text>
    <text x="28" y="169" font-size="10" fill="#475569">Appointments</text>
    <text x="28" y="191" font-size="10" fill="#475569">Billing</text>
    <rect x="20" y="256" width="94" height="24" rx="4" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="28" y="272" font-size="9" fill="#0F766E">Swagger API Docs</text>

    <!-- 4 KPI boxes -->
    <rect x="136" y="48" width="92" height="62" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="144" y="68" font-size="9" fill="#64748B">Patients</text>
    <text x="144" y="92" font-size="18" font-weight="700" fill="#0F172A">03</text>
    <rect x="236" y="48" width="92" height="62" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="244" y="68" font-size="9" fill="#64748B">Doctors</text>
    <text x="244" y="92" font-size="18" font-weight="700" fill="#0F172A">03</text>
    <rect x="336" y="48" width="92" height="62" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="344" y="68" font-size="9" fill="#64748B">Scheduled</text>
    <text x="344" y="92" font-size="18" font-weight="700" fill="#0F172A">02</text>
    <rect x="436" y="48" width="92" height="62" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="444" y="68" font-size="9" fill="#64748B">Revenue</text>
    <text x="444" y="92" font-size="16" font-weight="700" fill="#0F766E">৳800</text>

    <!-- Upcoming table wireframe -->
    <rect x="136" y="124" width="392" height="172" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="150" y="146" font-size="11" font-weight="600" fill="#0F172A">Upcoming Appointments</text>
    <line x1="146" y1="158" x2="518" y2="158" stroke="#E2E8F0"/>
    <rect x="150" y="168" width="366" height="24" rx="4" fill="#F8FAFC"/>
    <text x="158" y="184" font-size="10" fill="#334155">Nusrat Jahan · Dr. Sabrina Islam · FOLLOW_UP</text>
    <rect x="150" y="200" width="366" height="24" rx="4" fill="#F8FAFC"/>
    <text x="158" y="216" font-size="10" fill="#334155">Rafiqul Islam · Dr. Tariq Hasan · EMERGENCY</text>
    <rect x="150" y="252" width="110" height="28" rx="6" fill="#0F766E"/>
    <text x="205" y="270" text-anchor="middle" font-size="10" font-weight="600" fill="#FFFFFF">+ New Appointment</text>
  </g>

  <!-- Panel 3: Appointment Booking -->
  <g transform="translate(40,430)">
    <rect width="540" height="310" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <rect width="540" height="36" rx="12" fill="#F1F5F9"/>
    <rect y="24" width="540" height="12" fill="#F1F5F9"/>
    <circle cx="20" cy="18" r="5" fill="#94A3B8"/><circle cx="36" cy="18" r="5" fill="#94A3B8"/><circle cx="52" cy="18" r="5" fill="#94A3B8"/>
    <text x="75" y="22" font-size="12" font-weight="600" fill="#334155">3. Appointment Booking &amp; Factory Pattern (/appointments)</text>

    <rect x="24" y="54" width="492" height="34" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="38" y="75" font-size="11" fill="#334155">Filter: [ ALL ]  [ SCHEDULED ]  [ COMPLETED ]  [ CANCELLED ]</text>
    <rect x="388" y="59" width="118" height="24" rx="5" fill="#0F766E"/>
    <text x="447" y="75" text-anchor="middle" font-size="10" font-weight="600" fill="#FFFFFF">+ Book Slot</text>

    <rect x="65" y="102" width="410" height="190" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-dasharray="4 3"/>
    <text x="85" y="126" font-size="12" font-weight="700" fill="#0F172A">Modal: Book Appointment (Factory + Conflict Check)</text>
    <rect x="85" y="140" width="175" height="26" rx="5" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="95" y="157" font-size="10" fill="#475569">Patient: Select Patient ▼</text>
    <rect x="275" y="140" width="180" height="26" rx="5" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="285" y="157" font-size="10" fill="#475569">Doctor: Select Doctor ▼</text>
    <rect x="85" y="176" width="175" height="26" rx="5" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="95" y="193" font-size="10" fill="#475569">Visit Type: EMERGENCY ▼</text>
    <rect x="275" y="176" width="180" height="26" rx="5" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="285" y="193" font-size="10" fill="#475569">Date &amp; Slot: 2026-12-01 11:00</text>
    <rect x="85" y="212" width="370" height="26" rx="5" fill="#CCFBF1"/>
    <text x="95" y="229" font-size="10" font-weight="600" fill="#0F766E">Estimated Strategy Fee: ৳1,400 (1.5× base + 200 surcharge)</text>
    <rect x="335" y="250" width="120" height="28" rx="6" fill="#0F766E"/>
    <text x="395" y="268" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">Confirm Booking</text>
  </g>

  <!-- Panel 4: Billing -->
  <g transform="translate(620,430)">
    <rect width="540" height="310" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <rect width="540" height="36" rx="12" fill="#F1F5F9"/>
    <rect y="24" width="540" height="12" fill="#F1F5F9"/>
    <circle cx="20" cy="18" r="5" fill="#94A3B8"/><circle cx="36" cy="18" r="5" fill="#94A3B8"/><circle cx="52" cy="18" r="5" fill="#94A3B8"/>
    <text x="75" y="22" font-size="12" font-weight="600" fill="#334155">4. Billing &amp; Payment Adapter (/billing)</text>

    <rect x="24" y="54" width="236" height="52" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="36" y="74" font-size="10" fill="#64748B">Collected Revenue</text>
    <text x="36" y="96" font-size="16" font-weight="700" fill="#0F766E">৳2,200</text>
    <rect x="274" y="54" width="242" height="52" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="286" y="74" font-size="10" fill="#64748B">Pending Invoices</text>
    <text x="286" y="96" font-size="16" font-weight="700" fill="#B45309">1 Unpaid</text>

    <rect x="24" y="122" width="492" height="168" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="38" y="144" font-size="11" font-weight="600" fill="#0F172A">Invoices (Strategy Calculation + Bank Adapter Checkout)</text>
    <line x1="24" y1="156" x2="516" y2="156" stroke="#E2E8F0"/>
    <rect x="38" y="168" width="464" height="36" rx="6" fill="#F8FAFC"/>
    <text x="50" y="190" font-size="10" fill="#0F172A">INV #1 · Tanvir Ahmed · ৳800 · PAID (TXN-BANK-...)</text>
    <rect x="38" y="216" width="464" height="44" rx="6" fill="#FFFBEB" stroke="#FDE68A"/>
    <text x="50" y="242" font-size="10" fill="#0F172A">INV #2 · Nusrat Jahan · ৳600 · UNPAID</text>
    <rect x="404" y="225" width="84" height="26" rx="5" fill="#0F766E"/>
    <text x="446" y="242" text-anchor="middle" font-size="10" font-weight="600" fill="#FFFFFF">Pay Now</text>
  </g>
</svg>
